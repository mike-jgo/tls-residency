[package]
name = "station-slint"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native tap screen for the Staffer Attendance Monitoring System (see ../PLAN.md)"

[dependencies]
slint = "1.18"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
