[package]
name = "tls-residency"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone native staffer attendance, registration and administration"

[features]
pi-kms = ["slint/backend-linuxkms"]

[dependencies]
slint = "1.18"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
base64 = "0.23.1"
ring = "0.17.14"
subtle = "2.6.1"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
